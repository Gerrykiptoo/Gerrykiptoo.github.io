# ========================================================
#  GERRY BIWOTT | PORTFOLIO CONFIGURATION - MINIMAL MISTAKES
# ========================================================

title: "Gerry Biwott | Portfolio"
email: gerrykiptoo@gmail.com
description: >-
  Full Stack Developer & DevOps Engineer | Cloud & Security Specialist.
  Passionate about building scalable systems, automating workflows, and integrating security in cloud infrastructure.

# Social handles (for SEO + footer)
github_username: gerrykiptoo
linkedin_username: gerrybiwott
minimal_mistakes_skin: mint
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.24.0
permalink: /:categories/:title/
timezone: Africa/Nairobi

include:
  - _pages
  - assets

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

# --------------------------------------------------------
# Author Information
# --------------------------------------------------------
author:
  name   : "Gerry Kiptoo Biwott"
  avatar : "/assets/images/profile.jpg"
  bio    : "Full Stack Developer & DevOps Engineer | Cloud & Security Specialist | Passionate about CI/CD, Automation & Scalable Cloud Systems."
  location: "Nairobi, Kenya"
  links:
    - label: "LinkedIn"
      url: "https://linkedin.com/in/gerrybiwott"
    - label: "GitHub"
      url: "https://github.com/gerrykiptoo"
    - label: "Email"
      url: "mailto:gerrykiptoo@gmail.com"

# --------------------------------------------------------
# Footer links
# --------------------------------------------------------
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/gerrybiwott"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/gerrykiptoo"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:gerrykiptoo@gmail.com"

# --------------------------------------------------------
# Defaults - Pages & Posts Layout
# --------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# --------------------------------------------------------
# Navigation Menu
# --------------------------------------------------------
nav:
  - title: "Home"
    url: /
  - title: "About"
    url: /about/
  - title: "Resume"
    url: /resume/
  - title: "Projects"
    url: /projects/
  - title: "Lab Challenges"
    url: /lab-challenges/
  - title: "Contact"
    url: /contact/

# --------------------------------------------------------
# Archives (optional)
# --------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
