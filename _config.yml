# ========================================================
#  GERRY KIPTOO BIWOTT | PORTFOLIO CONFIGURATION
#  Theme: Minimal Mistakes
# ========================================================

title: "Gerry Biwott | Portfolio"
email: "gerrykiptoo@gmail.com"
description: >-
  Full Stack Developer & DevOps Engineer | Cloud & Security Specialist.
  Passionate about building scalable systems, automating workflows, and integrating security into modern cloud infrastructure.


# --------------------------------------------------------
# SITE SETTINGS
# --------------------------------------------------------
timezone: "Africa/Nairobi"
permalink: /:categories/:title/
markdown: kramdown
search: true
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# ✅ Use an existing skin — options include: default, air, contrast, dark, neon, sunrise
minimal_mistakes_skin: "default"

# --------------------------------------------------------
# INCLUDE & PLUGINS
# --------------------------------------------------------
include:
  - _pages
  - assets

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

# --------------------------------------------------------
# AUTHOR PROFILE
# --------------------------------------------------------
author:
  name: "Gerry Kiptoo Biwott"
  avatar: "/assets/images/profile.jpg"
  bio: >-
    Full Stack & DevOps Engineer | Cloud Security & Automation Enthusiast.
  location: "Nairobi, Kenya"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/gerrybiwott"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/gerrykiptoo"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:gerrykiptoo@gmail.com"


# --------------------------------------------------------
# FOOTER LINKS
# --------------------------------------------------------
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/gerrybiwott"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/gerrykiptoo"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:gerrykiptoo@gmail.com"

# --------------------------------------------------------
# DEFAULT LAYOUTS
# --------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# --------------------------------------------------------
# NAVIGATION MENU
# --------------------------------------------------------
nav:
  - title: "Home"
    url: /
  - title: "About"
    url: /about/
  - title: "Resume"
    url: /resume/
  - title: "Projects"
    url: /projects/
  - title: "Lab Challenges"
    url: /lab-challenges/
  - title: "Contact"
    url: /contact/

# --------------------------------------------------------
# ARCHIVES (OPTIONAL)
# --------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
